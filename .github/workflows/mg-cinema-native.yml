          cat << 'EOF' > MgCinemaProject/app/src/main/java/com/magai/mgcinema/MainActivity.java
          package com.magai.mgcinema;

          import android.animation.ArgbEvaluator;
          import android.animation.ValueAnimator;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends AppCompatActivity {

              private static final String APP_VERSION = "0.2";
              private static final String SERVER_COMPAT = "MG Server v0.2";

              private EditText etServerIp, etServerPort;
              private TextView tvServerBadge, tvCurrentPath, tvVersionInfo;
              private Button btnToggleView;
              private LinearLayout dynamicListContainer;
              private ScrollView mainScroll;
              private View glowLayer;
              private SharedPreferences prefs;

              private String currentSubPath = "";
              private boolean gridMode = true;
              private int currentGridColumns = 3;
              private final List<View> focusableCards = new ArrayList<>();
              private List<MediaEntry> lastFolders = new ArrayList<>();
              private List<MediaEntry> lastItems = new ArrayList<>();
              private boolean hasLoadedOnce = false;

              private static class MediaEntry {
                  final String name;
                  final String urlOrPath;
                  final String type;

                  MediaEntry(String name, String urlOrPath, String type) {
                      this.name = name;
                      this.urlOrPath = urlOrPath;
                      this.type = type;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("mg_cinema_prefs", MODE_PRIVATE);

                  etServerIp = findViewById(R.id.etServerIp);
                  etServerPort = findViewById(R.id.etServerPort);
                  tvServerBadge = findViewById(R.id.tvServerBadge);
                  tvCurrentPath = findViewById(R.id.tvCurrentPath);
                  tvVersionInfo = findViewById(R.id.tvVersionInfo);
                  btnToggleView = findViewById(R.id.btnToggleView);
                  dynamicListContainer = findViewById(R.id.dynamicListContainer);
                  mainScroll = findViewById(R.id.mainScroll);
                  glowLayer = findViewById(R.id.glowLayer);
                  ImageView ivBrandLogo = findViewById(R.id.ivBrandLogo);

                  ivBrandLogo.setImageResource(R.mipmap.ic_launcher);
                  tvVersionInfo.setText("v" + APP_VERSION + " • Mag Ai • متوافق مع " + SERVER_COMPAT);

                  etServerIp.setText(prefs.getString("ip", "192.168.1.200"));
                  etServerPort.setText(prefs.getString("port", "8080"));
                  gridMode = prefs.getBoolean("grid_mode", true);
                  updateToggleViewLabel();

                  Button btnConnect = findViewById(R.id.btnConnect);
                  Button btnOpenWeb = findViewById(R.id.btnOpenWeb);
                  Button btnBackDir = findViewById(R.id.btnBackDir);

                  setupScrollAmbientLighting();

                  btnConnect.setOnClickListener(v -> {
                      saveServerConfig();
                      currentSubPath = "";
                      fetchDirectory(currentSubPath);
                  });

                  btnToggleView.setOnClickListener(v -> {
                      gridMode = !gridMode;
                      prefs.edit().putBoolean("grid_mode", gridMode).apply();
                      updateToggleViewLabel();
                      if (hasLoadedOnce) {
                          renderEntries(lastFolders, lastItems);
                      }
                  });

                  btnOpenWeb.setOnClickListener(v -> {
                      saveServerConfig();
                      String url = buildBaseUrl() + (currentSubPath.isEmpty() ? "/" : ("/" + encodePathSegments(currentSubPath) + "/"));
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(i);
                      } catch (Exception ignored) {}
                  });

                  btnBackDir.setOnClickListener(v -> {
                      if (!currentSubPath.isEmpty()) {
                          int slash = currentSubPath.lastIndexOf('/');
                          currentSubPath = (slash > 0) ? currentSubPath.substring(0, slash) : "";
                          fetchDirectory(currentSubPath);
                      }
                  });

                  btnConnect.requestFocus();
                  fetchDirectory(currentSubPath);
              }

              private void updateToggleViewLabel() {
                  btnToggleView.setText(gridMode ? "عرض: شبكي" : "عرض: قائمة");
              }

              private void setupScrollAmbientLighting() {
                  mainScroll.getViewTreeObserver().addOnScrollChangedListener(() -> {
                      int maxScroll = Math.max(1, dynamicListContainer.getHeight() - mainScroll.getHeight());
                      float ratio = Math.min(1f, Math.max(0f, (float) mainScroll.getScrollY() / (float) maxScroll));
                      int colorFrom = Color.argb(38, 229, 9, 20);
                      int colorTo = Color.argb(52, 124, 58, 237);
                      int blended = (Integer) new ArgbEvaluator().evaluate(ratio, colorFrom, colorTo);
                      glowLayer.setBackgroundColor(blended);
                  });
              }

              private void saveServerConfig() {
                  prefs.edit()
                          .putString("ip", etServerIp.getText().toString().trim())
                          .putString("port", etServerPort.getText().toString().trim())
                          .apply();
              }

              private String buildBaseUrl() {
                  String ip = etServerIp.getText().toString().trim();
                  String port = etServerPort.getText().toString().trim();
                  if (ip.isEmpty()) ip = "192.168.1.200";
                  if (port.isEmpty()) port = "8080";
                  return "http://" + ip + ":" + port;
              }

              private String encodePathSegments(String rel) {
                  String[] parts = rel.split("/");
                  StringBuilder sb = new StringBuilder();
                  for (String p : parts) {
                      if (p.isEmpty()) continue;
                      if (sb.length() > 0) sb.append("/");
                      try {
                          sb.append(URLEncoder.encode(p, "UTF-8").replace("+", "%20"));
                      } catch (Exception e) {
                          sb.append(p);
                      }
                  }
                  return sb.toString();
              }

              private void fetchDirectory(final String subPath) {
                  tvCurrentPath.setText("المسار: /" + (subPath.isEmpty() ? "MG Server" : subPath));
                  tvServerBadge.setText("جاري الفحص...");
                  tvServerBadge.setTextColor(0xFFFACC15);

                  new Thread(() -> {
                      String base = buildBaseUrl();
                      String builtUrl = base + "/api/media";
                      if (!subPath.isEmpty()) {
                          try {
                              builtUrl += "?path=" + URLEncoder.encode(subPath, "UTF-8");
                          } catch (Exception ignored) {}
                      }
                      final String finalApiUrl = builtUrl;

                      String json = httpGetText(finalApiUrl);
                      if (json != null && (json.contains("\"folders\"") || json.contains("\"items\"") || json.contains("\"files\""))) {
                          List<MediaEntry> folders = parseArrayEntries(json, "folders", "folder");
                          List<MediaEntry> items = parseArrayEntries(json, "items", null);
                          if (items.isEmpty()) {
                              items = parseArrayEntries(json, "files", null);
                          }
                          final List<MediaEntry> finalFolders = folders;
                          final List<MediaEntry> finalItems = items;
                          runOnUiThread(() -> {
                              tvServerBadge.setText("متصل • " + base.replace("http://", ""));
                              tvServerBadge.setTextColor(0xFF4ADE80);
                              lastFolders = finalFolders;
                              lastItems = finalItems;
                              hasLoadedOnce = true;
                              renderEntries(finalFolders, finalItems);
                          });
                      } else {
                          runOnUiThread(() -> {
                              tvServerBadge.setText("غير متصل • تحقق من MG Server");
                              tvServerBadge.setTextColor(0xFFFF6B8B);
                              renderEmptyMessage("تعذر الوصول إلى " + finalApiUrl + "\nتأكد من تشغيل تطبيق MG Server v0.2 وأن الجهازين على نفس الشبكة.");
                          });
                      }
                  }).start();
              }

              private String httpGetText(String urlStr) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setConnectTimeout(4000);
                      conn.setReadTimeout(6000);
                      conn.setRequestMethod("GET");
                      if (conn.getResponseCode() == 200) {
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) {
                              sb.append(line);
                          }
                          br.close();
                          return sb.toString();
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
                  return null;
              }

              private List<MediaEntry> parseArrayEntries(String json, String arrayKey, String forcedType) {
                  List<MediaEntry> out = new ArrayList<>();
                  Pattern arrPattern = Pattern.compile("\"" + arrayKey + "\"\\s*:\\s*\\[(.*?)\\]", Pattern.DOTALL);
                  Matcher arrMatcher = arrPattern.matcher(json);
                  if (!arrMatcher.find()) return out;

                  String body = arrMatcher.group(1);
                  Pattern objPattern = Pattern.compile("\\{(.*?)\\}", Pattern.DOTALL);
                  Matcher objMatcher = objPattern.matcher(body);
                  while (objMatcher.find()) {
                      String obj = objMatcher.group(1);
                      String name = unescapeJson(extractJsonField(obj, "name"));
                      String path = unescapeJson(extractJsonField(obj, "path"));
                      String url = unescapeJson(extractJsonField(obj, "url"));
                      String rawType = forcedType != null ? forcedType : extractJsonField(obj, "type").toLowerCase();
                      String resolvedType = normalizeMediaType(name, rawType);
                      String target = !url.isEmpty() ? url : path;
                      if (!name.isEmpty()) {
                          out.add(new MediaEntry(name, target, resolvedType));
                      }
                  }
                  return out;
              }

              private String normalizeMediaType(String name, String rawType) {
                  if ("folder".equals(rawType)) return "folder";
                  String l = name.toLowerCase();
                  if ("audio".equals(rawType) || "sound".equals(rawType) || "music".equals(rawType)
                          || l.endsWith(".mp3") || l.endsWith(".m4a") || l.endsWith(".wav")
                          || l.endsWith(".ogg") || l.endsWith(".flac") || l.endsWith(".aac") || l.endsWith(".opus")) {
                      return "audio";
                  }
                  if ("video".equals(rawType)
                          || l.endsWith(".mp4") || l.endsWith(".mkv") || l.endsWith(".webm")
                          || l.endsWith(".avi") || l.endsWith(".mov") || l.endsWith(".3gp")) {
                      return "video";
                  }
                  if ("image".equals(rawType)
                          || l.endsWith(".jpg") || l.endsWith(".jpeg") || l.endsWith(".png")
                          || l.endsWith(".webp") || l.endsWith(".gif")) {
                      return "image";
                  }
                  return rawType.isEmpty() ? "other" : rawType;
              }

              private String extractJsonField(String obj, String key) {
                  Pattern p = Pattern.compile("\"" + key + "\"\\s*:\\s*\"(.*?)\"");
                  Matcher m = p.matcher(obj);
                  return m.find() ? m.group(1) : "";
              }

              private String unescapeJson(String s) {
                  return s.replace("\\\\", "\\").replace("\\\"", "\"").replace("\\n", "\n");
              }

              private void renderEmptyMessage(String msg) {
                  dynamicListContainer.removeAllViews();
                  focusableCards.clear();
                  TextView tv = new TextView(this);
                  tv.setText(msg);
                  tv.setTextColor(0xFFE5E7EB);
                  tv.setTextSize(14f);
                  tv.setPadding(16, 20, 16, 20);
                  tv.setBackgroundResource(R.drawable.tv_focus_item);
                  dynamicListContainer.addView(tv);
              }

              private void renderEntries(List<MediaEntry> folders, List<MediaEntry> items) {
                  dynamicListContainer.removeAllViews();
                  focusableCards.clear();

                  currentGridColumns = gridMode ? 3 : 1;

                  if (!folders.isEmpty()) {
                      dynamicListContainer.addView(createSectionHeader("📁 المجلدات (" + folders.size() + ")"));
                      List<View> folderCards = new ArrayList<>();
                      for (final MediaEntry f : folders) {
                          View card = createCardView("📁", f.name, "فتح المجلد");
                          card.setOnClickListener(v -> {
                              currentSubPath = currentSubPath.isEmpty() ? f.name : (currentSubPath + "/" + f.name);
                              fetchDirectory(currentSubPath);
                          });
                          folderCards.add(card);
                      }
                      attachCards(folderCards);
                  }

                  List<MediaEntry> videos = new ArrayList<>();
                  List<MediaEntry> audios = new ArrayList<>();
                  List<MediaEntry> images = new ArrayList<>();
                  List<MediaEntry> docsAndApps = new ArrayList<>();

                  for (MediaEntry m : items) {
                      if ("video".equals(m.type)) videos.add(m);
                      else if ("audio".equals(m.type)) audios.add(m);
                      else if ("image".equals(m.type)) images.add(m);
                      else docsAndApps.add(m);
                  }

                  addMediaGroup("🎬 الفيديوهات", "🎬", videos);
                  addMediaGroup("🎵 الصوتيات", "🎵", audios);
                  addMediaGroup("🖼️ الصور", "🖼️", images);
                  addMediaGroup("📦 ملفات APK و PDF", "📦", docsAndApps);

                  if (folders.isEmpty() && items.isEmpty()) {
                      renderEmptyMessage("المجلد فارغ حالياً.\nضع ملفات أو مجلدات داخل مجلد MG Server على جهاز السيرفر ثم اضغط تحديث واتصال.");
                  }
              }

              private void addMediaGroup(String title, String icon, List<MediaEntry> list) {
                  if (list.isEmpty()) return;
                  dynamicListContainer.addView(createSectionHeader(title + " (" + list.size() + ")"));
                  List<View> groupCards = new ArrayList<>();
                  for (final MediaEntry item : list) {
                      String fullUrl = buildBaseUrl() + (item.urlOrPath.startsWith("/") ? item.urlOrPath : ("/" + item.urlOrPath));
                      View card = createCardView(icon, item.name, "تشغيل عبر السيرفر");
                      card.setOnClickListener(v -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW);
                              intent.setDataAndType(Uri.parse(fullUrl), guessIntentMime(item.name, item.type));
                              startActivity(intent);
                          } catch (Exception e) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(fullUrl)));
                              } catch (Exception ignored) {}
                          }
                      });
                      groupCards.add(card);
                  }
                  attachCards(groupCards);
              }

              private void attachCards(List<View> cards) {
                  int cols = gridMode ? currentGridColumns : 1;
                  LinearLayout currentRow = null;

                  for (int i = 0; i < cards.size(); i++) {
                      if (i % cols == 0) {
                          currentRow = new LinearLayout(this);
                          currentRow.setOrientation(LinearLayout.HORIZONTAL);
                          currentRow.setWeightSum(cols);
                          LinearLayout.LayoutParams rowLp = new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                          rowLp.setMargins(0, 0, 0, 12);
                          currentRow.setLayoutParams(rowLp);
                          dynamicListContainer.addView(currentRow);
                      }

                      View card = cards.get(i);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              0,
                              gridMode ? ViewGroup.LayoutParams.WRAP_CONTENT : ViewGroup.LayoutParams.WRAP_CONTENT,
                              1f
                      );
                      lp.setMargins(cols > 1 ? 6 : 0, 0, cols > 1 ? 6 : 0, 0);
                      card.setLayoutParams(lp);
                      currentRow.addView(card);
                      focusableCards.add(card);
                  }
              }

              private String guessIntentMime(String name, String type) {
                  String l = name.toLowerCase();
                  if ("video".equals(type) || l.endsWith(".mp4") || l.endsWith(".mkv") || l.endsWith(".webm")) return "video/*";
                  if ("audio".equals(type) || l.endsWith(".mp3") || l.endsWith(".m4a") || l.endsWith(".wav")
                          || l.endsWith(".ogg") || l.endsWith(".flac") || l.endsWith(".aac") || l.endsWith(".opus")) return "audio/*";
                  if ("image".equals(type) || l.endsWith(".jpg") || l.endsWith(".jpeg") || l.endsWith(".png")) return "image/*";
                  if (l.endsWith(".pdf")) return "application/pdf";
                  if (l.endsWith(".apk")) return "application/vnd.android.package-archive";
                  return "*/*";
              }

              private TextView createSectionHeader(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(0xFFF3E8FF);
                  tv.setTextSize(16f);
                  tv.setPadding(4, 16, 4, 8);
                  return tv;
              }

              private View createCardView(String emoji, String title, String subtitle) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(14, gridMode ? 22 : 14, 14, gridMode ? 22 : 14);
                  box.setBackgroundResource(R.drawable.tv_focus_item);
                  box.setFocusable(true);
                  box.setFocusableInTouchMode(true);

                  TextView iconTv = new TextView(this);
                  iconTv.setText(emoji);
                  iconTv.setTextSize(gridMode ? 34f : 22f);
                  iconTv.setGravity(Gravity.CENTER);

                  TextView titleTv = new TextView(this);
                  titleTv.setText(title);
                  titleTv.setTextColor(0xFFFFFFFF);
                  titleTv.setTextSize(gridMode ? 14f : 15f);
                  titleTv.setGravity(Gravity.CENTER);
                  titleTv.setMaxLines(2);
                  titleTv.setPadding(0, 8, 0, 2);

                  TextView subTv = new TextView(this);
                  subTv.setText(subtitle);
                  subTv.setTextColor(0xFFC4B5FD);
                  subTv.setTextSize(11f);
                  subTv.setGravity(Gravity.CENTER);

                  box.addView(iconTv);
                  box.addView(titleTv);
                  box.addView(subTv);

                  box.setOnFocusChangeListener((v, hasFocus) -> {
                      v.animate().scaleX(hasFocus ? 1.04f : 1.0f)
                                 .scaleY(hasFocus ? 1.04f : 1.0f)
                                 .setDuration(140)
                                 .start();
                      if (hasFocus) {
                          mainScroll.smoothScrollTo(0, Math.max(0, v.getTop() - 120));
                          ValueAnimator anim = ValueAnimator.ofObject(
                                  new ArgbEvaluator(),
                                  Color.argb(30, 229, 9, 20),
                                  Color.argb(62, 124, 58, 237)
                          );
                          anim.setDuration(260);
                          anim.addUpdateListener(a -> glowLayer.setBackgroundColor((Integer) a.getAnimatedValue()));
                          anim.start();
                      }
                  });
                  return box;
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() == KeyEvent.ACTION_DOWN) {
                      int code = event.getKeyCode();
                      if (code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_ESCAPE) {
                          if (!currentSubPath.isEmpty()) {
                              int slash = currentSubPath.lastIndexOf('/');
                              currentSubPath = (slash > 0) ? currentSubPath.substring(0, slash) : "";
                              fetchDirectory(currentSubPath);
                              return true;
                          }
                      } else if (gridMode && (code == KeyEvent.KEYCODE_DPAD_DOWN || code == KeyEvent.KEYCODE_DPAD_UP)) {
                          View currentFocus = getCurrentFocus();
                          int idx = focusableCards.indexOf(currentFocus);
                          if (idx != -1) {
                              int targetIdx = (code == KeyEvent.KEYCODE_DPAD_DOWN)
                                      ? idx + currentGridColumns
                                      : idx - currentGridColumns;
                              if (targetIdx >= 0 && targetIdx < focusableCards.size()) {
                                  focusableCards.get(targetIdx).requestFocus();
                                  return true;
                              }
                          }
                      }
                  }
                  return super.dispatchKeyEvent(event);
              }
          }
          EOF

      - name: Apply Mg Cinema App Icon
        run: |
          python3 - << 'EOF'
          import os, struct, zlib

          def make_png(path, width=192, height=192, r=180, g=15, b=45):
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(height):
                  raw.append(0)
                  for x in range(width):
                      dx = (x - width / 2.0) / (width / 2.0)
                      dy = (y - height / 2.0) / (height / 2.0)
                      dist = (dx * dx + dy * dy) ** 0.5
                      boost = max(0.0, 1.0 - dist)
                      rr = min(255, int(r * 0.4 + 229 * boost))
                      gg = min(255, int(g * 0.4 + 25 * boost))
                      bb = min(255, int(b * 0.4 + 140 * boost))
                      raw.extend((rr, gg, bb, 255))
              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=6)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          src = None
          for candidate in ["0012.png", "icon.png", "ic_launcher.png", "app_icon.png"]:
              if os.path.exists(candidate):
                  src = candidate
                  break
          if not src:
              for root, _, files in os.walk("."):
                  if ".git" in root or "MgCinemaProject" in root:
                      continue
                  for fn in files:
                      if fn.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                          src = os.path.join(root, fn)
                          break
                  if src:
                      break

          densities = ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]
          for d in densities:
              out_dir = os.path.join("MgCinemaProject/app/src/main/res", d)
              os.makedirs(out_dir, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  dst = os.path.join(out_dir, name)
                  if src:
                      with open(src, "rb") as rf, open(dst, "wb") as wf:
                          wf.write(rf.read())
                  else:
                      make_png(dst)
          EOF

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp/gradle
          cd MgCinemaProject
          /tmp/gradle/gradle-8.7/bin/gradle assembleDebug --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ERROR SUMMARY ==="
            grep -E "FAILURE:|Execution failed for task|Caused by:|error:" -A 4 build.log | tail -n 60 || true
            exit $EXIT_CODE
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Mg-Cinema-v0.2.apk

      - name: Upload Mg Cinema APK
        uses: actions/upload-artifact@v4
        with:
          name: mg-cinema-native-apk
          path: MgCinemaProject/app/build/outputs/apk/debug/Mg-Cinema-v0.2.apk
